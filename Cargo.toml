[package]
name = "airledger-engine"
version = "0.0.1"
edition = "2021"
description = "Schema-driven ingest engine — shared business logic for airledger mobile (Flutter FFI) and Oxy customer-app bundles (WASM)"
license = "Apache-2.0"

# Sibling crate to airlayer. Same pattern: a Rust core compiles to a
# native lib for Dart FFI and to WASM for the Oxy React SDK. No FFI /
# WASM glue yet — Phase 1 is the schema model + parser, with the real
# airledger-fitness + pokehouse-ledger YAMLs as test fixtures.

[lib]
name = "airledger_engine"
# Three crate types:
# - rlib: native Rust consumers (eventually airhouse, oxy-internal)
# - cdylib: dynamic library Dart's dart:ffi loads at runtime
# - staticlib: static archive for Swift / Kotlin native bindings
#   (added when we wire iOS / Android in phase 4b)
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
# Dates / weekdays / ISO formatting — used by derives + codec round-trip.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Jinja-equivalent for template interpolation. Matches the Dart Jinja
# semantics for `{{ var }}` and `{% if %}` blocks; we register a
# `round` filter to mirror our custom Dart filter.
minijinja = { version = "2", default-features = false, features = ["builtins"] }
# Sheets ingest (Phase 3) deps. `rustls-tls` keeps us off openssl-sys
# so cross-compile to Android NDK / iOS doesn't need a system libssl.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# RS256 JWT signing for the service-account → access-token flow.
jsonwebtoken = "9"
# Auto-id for new sheet rows. Matches Dart's `Uuid().v4()` shape.
uuid = { version = "1", features = ["v4"] }
# Percent-encode tab names in Sheets API URLs (apostrophes, spaces).
urlencoding = "2"

[dev-dependencies]
# Tests load actual YAML files via include_str! so changes in the
# schema repos are caught on `cargo test`.
