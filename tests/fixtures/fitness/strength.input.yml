  weight:
    widget: number
    required: true
    min: 0
    show_when:
      exercise:
        not_in_group: [isometric, timed, mobility]
  reps:
    widget: number
    required: true
    min: 0
    max: 100
    show_when:
      exercise:
        not_in_group: [isometric, timed]
  duration:
    widget: number
    required: true
    min: 0
    placeholder: "seconds"
    show_when:
      exercise:
        in_group: isometric
  start_time:
    widget: timer
    placeholder: 3:54:00 PM
    # Stop logs both: end_time as wall-clock (for timed exercises like
    # Handstand Practice) and duration in seconds (for isometric holds
    # like Plank). show_when on weight/reps/duration/end_time hides
    # whichever doesn't apply to the chosen exercise, so save drops the
    # irrelevant value automatically.
    stop_targets:
      - { target: end_time, format: time_of_day }
      - { target: duration, format: seconds }
  end_time:
    widget: text
    placeholder: 3:54:00 PM
    now_button: true
  rpe:
    widget: number
    min: 1
    max: 10
    show_when:
      exercise:
        not_in_group: [isometric, timed, mobility]
  notes:
    widget: longtext

# Named, reusable value sets for show_when. Adding more (e.g. cardio
# modalities, machine groups) is just another entry here — no schema
# change required.
groups:
  # Timed-session exercises: just start_time + end_time + notes. No
  # weight/reps/duration/rpe — the start/end stamps are the data.
  timed:
    - Handstand Practice
  # Low-load mobility/prep exercises: just reps. Weight + RPE hidden
  # because bodyweight mobility isn't a progressive-overload target —
  # the rep is the lever. Duration stays hidden (set count, not hold).
  mobility:
    - Open Books
    - Chin Tucks
    - Wall Slides
    - Serratus Wall Slides
  isometric:
