target: strength.view.yml
icon: dumbbell
date_field: date
# History-panel highlight: for each day in the history sheet, the row with
# the largest e1rm (Weight × (1 + Reps/30)) gets the "top set" tint.
# The measure itself is declared on strength.view.yml.
top_metric: max_e1rm
plannable:
  log_field: start_time
  log_format: time_string
post_log:
  model: sonnet
  prompt: |
    You're a sharp, technical strength coach. The user just logged a set,
    and you're judging it against the rest of today's workout AND the
    previous workout for the same exercise.

    Just-logged set:
      {{ row['exercise'] }} — {{ row['weight'] }} × {{ row['reps'] }}{% if row['rpe'] %} @ RPE {{ row['rpe'] }}{% endif %} {% if row['notes'] %}({{ row['notes'] }}){% endif %}

    Today's {{ row['exercise'] }} sets so far (this includes the just-logged set):
    {% for r in today_for('exercise', row['exercise']) %}
    - {{ r['weight'] }} × {{ r['reps'] }}{% if r['rpe'] %} @ RPE {{ r['rpe'] }}{% endif %} {% if r['notes'] %}— {{ r['notes'] }}{% endif %}
    {% else %}
    - (this is the first {{ row['exercise'] }} set today)
    {% endfor %}

    Previous {{ row['exercise'] }} workouts (newest first, up to 3):
    {% for workout in last_workouts_for('exercise', row['exercise'], 3) %}
    {{ workout[0]['date'] }}:
    {% for s in workout %}
      - {{ s['weight'] }} × {{ s['reps'] }}{% if s['rpe'] %} @ RPE {{ s['rpe'] }}{% endif %} {% if s['notes'] %}— {{ s['notes'] }}{% endif %}
    {% endfor %}
    {% else %}
    - (no prior {{ row['exercise'] }} sessions on record)
    {% endfor %}

    Reply with ONE short sentence — 22 words max — that compares this
    set to what you'd expect given today's ramp AND the previous workout.
    Call out one specific thing: a PR, a regression, a planned warmup
    landing as expected, a load/rep change vs. last session, or an RPE
    pattern. Be precise — reference actual numbers from the context, not
    generic platitudes. No emoji. No filler.
list_display:
  title: exercise
  subtitle: ${weight} × ${reps}
